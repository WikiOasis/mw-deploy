name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test
        env:
          # The suite never shells out to a real salt binary — FakeSaltClient
          # stands in — but point these somewhere obviously fake so a regression
          # that tries to exec fails loudly instead of finding /usr/bin/salt.
          MWDEPLOY_SALT_BINARY: /nonexistent/salt
          MWDEPLOY_SHIM_BINARY: /usr/local/bin/mwdeploy-shim

  shim:
    name: mwdeploy-shim tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the tools the shim shells out to
        run: sudo apt-get update && sudo apt-get install -y patch rsync

      - name: Configure git for the test fixtures
        run: |
          git config --global user.email "ci@wikioasis.org"
          git config --global user.name "CI"
          git config --global init.defaultBranch master

      - name: Run tests
        run: python3 -m unittest discover -s shim/tests -t . -v

  assets:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
